name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PDF-to-Images.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Images
          path: PDF-to-Images.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PDF to Images (build ${{ github.run_number }})
          body: |
            Download **PDF-to-Images.apk** below on your phone and open it to install.
            If Android says it can't update an older build, uninstall the old one first.
          files: PDF-to-Images.apk
          make_latest: true
          
